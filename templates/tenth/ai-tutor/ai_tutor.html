<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Tutor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .tutor-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .tutor-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .tutor-header h1 {
            font-size: 38px;
        }

        .tutor-header p {
            font-size: 18px;
            opacity: 0.85;
        }

        .chat-box {
            background: rgba(20, 30, 50, 0.95);
            border: 1px solid #168cff;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.25);
        }

        .message {
            padding: 15px;
            margin: 12px 0;
            border-radius: 15px;
            line-height: 1.6;
        }

        .bot-message {
            background: #102746;
            border-left: 4px solid #168cff;
        }

        .user-message {
            background: #103d31;
            border-left: 4px solid #20d9a0;
            text-align: right;
        }

        .language-settings {
            margin-top: 25px;
            padding: 18px;
            background: rgba(255,255,255,0.04);
            border-radius: 15px;
        }

        .language-settings h3 {
            margin-top: 0;
        }

        .language-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .language-buttons button {
            border: none;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
            background: #eeeeee;
            color: #111111;
        }

        .language-buttons button.active {
            background: #168cff;
            color: white;
        }

        #selectedLanguage {
            margin-top: 12px;
            font-weight: bold;
        }

        .input-area {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        #question {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #168cff;
            background: #07152b;
            color: white;
            font-size: 16px;
        }

        #askButton {
            padding: 15px 22px;
            border: none;
            border-radius: 12px;
            background: #168cff;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #askButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .voice-button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #eeeeee;
            color: #111111;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #168cff;
            text-decoration: none;
        }

        .loading {
            opacity: 0.7;
        }

        @media (max-width: 600px) {

            .input-area {
                flex-direction: column;
            }

            #askButton {
                width: 100%;
            }

            .tutor-header h1 {
                font-size: 28px;
            }
        }

    </style>

</head>


<body>


<div class="tutor-page">


    <!-- HEADER -->

    <div class="tutor-header">

        <h1>🤖 AI Tutor</h1>

        <p>
            Ask questions about courses,
            careers, streams and your future.
        </p>

    </div>


    <!-- CHAT -->

    <div class="chat-box">


        <!-- Initial message -->

        <div class="message bot-message">

            🤖 <strong>AI Tutor:</strong>

            <br>

            Hi! I am your AI Tutor.
            Ask me anything about careers,
            courses, streams or education.

        </div>


        <!-- Messages -->

        <div id="messages"></div>


        <!-- LANGUAGE SETTINGS -->

        <div class="language-settings">

            <h3>⚙️ Language Settings</h3>

            <div class="language-buttons">

                <button
                    onclick="selectLanguage('English', 'en-IN', this)"
                    class="active">
                    🇬🇧 English
                </button>

                <button
                    onclick="selectLanguage('Kannada', 'kn-IN', this)">
                    🇮🇳 ಕನ್ನಡ
                </button>

                <button
                    onclick="selectLanguage('Telugu', 'te-IN', this)">
                    🇮🇳 తెలుగు
                </button>

                <button
                    onclick="selectLanguage('Marathi', 'mr-IN', this)">
                    🇮🇳 मराठी
                </button>

                <button
                    onclick="selectLanguage('Hindi', 'hi-IN', this)">
                    🇮🇳 हिन्दी
                </button>

                <button
                    onclick="selectLanguage('Tamil', 'ta-IN', this)">
                    🇮🇳 தமிழ்
                </button>

            </div>


            <div id="selectedLanguage">

                Selected language:
                <strong>English</strong>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Ask your career question..."
                onkeydown="handleEnter(event)"
            >

            <button
                id="askButton"
                onclick="askTutor()">

                Ask 🤖

            </button>

        </div>


        <!-- VOICE -->

        <button
            class="voice-button"
            onclick="readLastAnswer()">

            🔊 Read Answer

        </button>


    </div>


    <!-- BACK -->

    <a
        href="/tenth"
        class="back-link">

        ← Back to 10th Career Guide

    </a>


</div>


<script>

let lastAnswer = "";

let selectedLanguage = "English";

let selectedVoiceLanguage = "en-IN";


/* =========================
   LANGUAGE SELECTION
========================= */

function selectLanguage(language, voiceLanguage, button) {

    selectedLanguage = language;

    selectedVoiceLanguage = voiceLanguage;


    document
        .querySelectorAll(".language-buttons button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");


    document.getElementById(
        "selectedLanguage"
    ).innerHTML =
        "Selected language: <strong>" +
        language +
        "</strong>";

}


/* =========================
   ASK AI TUTOR
========================= */

async function askTutor() {

    const input =
        document.getElementById("question");

    const question =
        input.value.trim();

    const askButton =
        document.getElementById("askButton");


    if (!question) {

        return;

    }


    addMessage(
        "You",
        question,
        "user-message"
    );


    input.value = "";


    askButton.disabled = true;

    askButton.innerText = "Thinking...";


    const loadingMessage =
        addMessage(
            "AI Tutor",
            "Thinking... 🤖",
            "bot-message loading"
        );


    try {

        /*
         IMPORTANT:
         Flask expects request.form.
         Therefore use FormData.
        */

        const formData =
            new FormData();

        formData.append(
            "question",
            question
        );

        formData.append(
            "language",
            selectedLanguage
        );


        const response =
            await fetch(
                "/tenth/ai-tutor",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        /*
         Remove loading message
        */

        if (loadingMessage) {

            loadingMessage.remove();

        }


        const answer =
            data.answer ||
            "Sorry, I could not generate an answer.";


        lastAnswer = answer;


        addMessage(
            "AI Tutor",
            answer,
            "bot-message"
        );


        /*
         Automatically speak
         Gemini answer in selected language
        */

        speakText(answer);


    }

    catch (error) {

        console.error(
            "AI Tutor Error:",
            error
        );


        if (loadingMessage) {

            loadingMessage.remove();

        }


        addMessage(
            "AI Tutor",
            "Sorry, something went wrong. Please try again.",
            "bot-message"
        );

    }


    askButton.disabled = false;

    askButton.innerText = "Ask 🤖";

}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(
    sender,
    text,
    className
) {

    const messages =
        document.getElementById(
            "messages"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " +
        className;


    const strong =
        document.createElement(
            "strong"
        );


    strong.innerText =
        sender + ":";


    div.appendChild(
        strong
    );


    div.appendChild(
        document.createElement(
            "br"
        )
    );


    const textNode =
        document.createTextNode(
            text
        );


    div.appendChild(
        textNode
    );


    messages.appendChild(
        div
    );


    messages.scrollTop =
        messages.scrollHeight;


    return div;

}


/* =========================
   ENTER KEY
========================= */

function handleEnter(event) {

    if (
        event.key === "Enter"
    ) {

        event.preventDefault();

        askTutor();

    }

}


/* =========================
   VOICE
========================= */

function readLastAnswer() {

    if (!lastAnswer) {

        return;

    }


    speakText(
        lastAnswer
    );

}


/* =========================
   SPEAK TEXT
========================= */

function speakText(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        alert(
            "Voice reading is not supported in this browser."
        );

        return;

    }


    /*
     Remove emojis and markdown
     before speaking.
    */

    const cleanText =
        text
            .replace(
                /[\u{1F300}-\u{1FAFF}]/gu,
                ""
            )
            .replace(
                /[*#_`]/g,
                ""
            );


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            cleanText
        );


    /*
     IMPORTANT:
     Set selected language.
    */

    speech.lang =
        selectedVoiceLanguage;


    speech.rate = 0.9;

    speech.pitch = 1;


    /*
     Find matching browser voice
    */

    const voices =
        window.speechSynthesis
            .getVoices();


    const matchingVoice =
        voices.find(
            voice =>
                voice.lang
                    .toLowerCase()
                    .startsWith(
                        selectedVoiceLanguage
                            .toLowerCase()
                            .split("-")[0]
                    )
        );


    if (matchingVoice) {

        speech.voice =
            matchingVoice;

    }


    window.speechSynthesis.speak(
        speech
    );

}


/*
Some browsers load voices
after page load.
*/

window.speechSynthesis
    .onvoiceschanged =
    function() {

        window.speechSynthesis
            .getVoices();

    };


</script>


</body>

</html>
